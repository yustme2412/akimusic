name: Build AkiMusic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libffi-dev libssl-dev autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake zip unzip \
            libltdl-dev

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.37"
          pip install "buildozer==1.5.0"

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b

      - name: Find and list APK
        run: |
          echo "Buscando APK..."
          find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null || echo "No se encontro APK"
          ls -la bin/ 2>/dev/null || echo "No hay carpeta bin/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkiMusic-APK
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload buildozer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/android/platform/build-*/dists/*/
            *.log
