name: Build AkiMusic APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            zip \
            unzip \
            python3-pip \
            python3-dev

      - name: Install Buildozer and dependencies
        run: |
          pip3 install --upgrade pip
          # Versiones exactas probadas y compatibles con Kivy en Android
          pip3 install "cython==0.29.37"
          pip3 install "buildozer==1.5.0"
          pip3 install "python-for-android==2023.9.16"
          pip3 install mutagen requests yt-dlp pillow

      - name: Build Android APK with Buildozer
        run: |
          buildozer -v android debug 2>&1 | tee build_output.txt
          # Mostrar las ultimas 200 lineas si falla
          if [ $? -ne 0 ]; then
            echo "=== ULTIMAS 200 LINEAS DEL LOG ==="
            tail -200 build_output.txt
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkiMusic-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
